name: Release

# Tag-driven release builds. Push a version tag (e.g. v0.1.0) and each
# platform builds installers attached to a draft GitHub Release:
#   Windows: MSI + NSIS (x64)
#   macOS:   DMG (arm64 + x64, unsigned)
#   Linux:   deb, rpm and AppImage (x64, built on 22.04 for glibc compat)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
          - macos-13

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Fetch PDFium for this platform
        run: node scripts/fetch-pdfium.mjs

      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "bookshelf_pdf ${{ github.ref_name }}"
          releaseBody: |
            Download the asset for your platform from the list below.

            - **Windows**: `.msi` or `.exe` (NSIS) installer
            - **macOS**: `.aarch64.dmg` (Apple Silicon) or `.x64.dmg` (Intel) —
              unsigned, so right-click → Open on first launch
            - **Linux**: `.deb`, `.rpm` or `.AppImage`
          releaseDraft: true
          prerelease: false
