name: Release

# Tag-driven release builds. Push a version tag (e.g. v0.1.0) and each
# platform builds installers attached to a draft GitHub Release:
#   Windows: MSI + NSIS (x64)
#   macOS:   universal DMG (Intel + Apple Silicon, unsigned)
#   Linux:   deb, rpm and AppImage (x64, built on 22.04 for glibc compat)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            pdfium-target: linux-x64
          - platform: windows-latest
            pdfium-target: win32-x64
          - platform: macos-latest
            pdfium-target: darwin-universal
            rust-targets: x86_64-apple-darwin,aarch64-apple-darwin
            tauri-args: --target universal-apple-darwin

    runs-on: ${{ matrix.platform }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.5"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            librsvg2-dev \
            patchelf

      - name: Fetch PDFium for this platform
        run: node scripts/fetch-pdfium.mjs ${{ matrix.pdfium-target }}

      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "bookshelf_pdf ${{ github.ref_name }}"
          releaseBody: |
            Download the asset for your platform from the list below.

            - **Windows**: `.msi` or `.exe` (NSIS) installer
            - **macOS**: universal `.dmg` (Intel and Apple Silicon) —
              unsigned, so right-click → Open on first launch
            - **Linux**: `.deb`, `.rpm` or `.AppImage`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri-args }}
