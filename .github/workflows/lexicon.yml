name: Lexicon refresh

# Rebuilds the bundled Wiktionary pronunciation table from kaikki.org's
# English extract (~534 MB download, streamed). The distilled table it
# commits rides along with the next app release. Manual dispatch or the
# first of each month.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract the pronunciation table
        run: node scripts/extract-wiktionary-ipa.mjs

      - name: Commit refreshed table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/resources/pronunciation/en-US.tsv.gz
          if git diff --cached --quiet; then
            echo "no table changes"
            exit 0
          fi
          git commit -m "chore(lexicon): refresh Wiktionary pronunciation table"
          git push
