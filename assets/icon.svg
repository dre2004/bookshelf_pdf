<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- bookshelf_pdf application icon: two books on a shelf, app blue -->
  <rect width="1024" height="1024" rx="224" fill="#0e6ba8"/>
  <g>
    <!-- left book (upright) -->
    <rect x="236" y="236" width="240" height="500" rx="20" fill="#f2f5f8"/>
    <rect x="236" y="236" width="52" height="500" rx="20" fill="#0b4f7a"/>
    <rect x="330" y="330" width="96" height="16" rx="8" fill="#9db9cd"/>
    <rect x="330" y="376" width="96" height="16" rx="8" fill="#9db9cd"/>
    <rect x="330" y="422" width="64" height="16" rx="8" fill="#9db9cd"/>
    <!-- right book (leaning) -->
    <g transform="rotate(12 628 486)">
      <rect x="508" y="236" width="240" height="500" rx="20" fill="#ffffff"/>
      <rect x="696" y="236" width="52" height="500" rx="20" fill="#1a86c8"/>
      <rect x="560" y="330" width="96" height="16" rx="8" fill="#9db9cd"/>
      <rect x="560" y="376" width="96" height="16" rx="8" fill="#9db9cd"/>
      <rect x="560" y="422" width="64" height="16" rx="8" fill="#9db9cd"/>
    </g>
    <!-- shelf -->
    <rect x="180" y="788" width="664" height="56" rx="28" fill="#ffffff"/>
  </g>
</svg>
