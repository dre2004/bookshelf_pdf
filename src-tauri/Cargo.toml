[package]
name = "bookshelf-pdf"
version = "0.1.0"
description = "Cross-platform PDF book reader built with Tauri 2 and PDFium"
authors = ["Andres"]
license = "AGPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bookshelf_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = "0.9.4"
tauri-plugin-dialog = "2.8.4"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
tauri-plugin-window-state = "2.5.0"
tauri-plugin-single-instance = "2.5.5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
